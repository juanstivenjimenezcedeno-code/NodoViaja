<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración de la página y carga de Tailwind CSS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Nodoviaja</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<!-- Clases iniciales y variantes que login.js usa para cambiar entre temas -->
<body data-theme="dark"
    data-dark-class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-900 via-slate-950 to-amber-950 p-4 text-slate-100 transition-colors duration-300"
    data-light-class="flex min-h-screen items-center justify-center bg-gradient-to-br from-sky-100 via-slate-50 to-amber-100 p-4 text-slate-800 transition-colors duration-300"
    class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-900 via-slate-950 to-amber-950 p-4 text-slate-100 transition-colors duration-300">
    <!-- Tarjeta principal del inicio de sesión -->
    <main
        data-dark-class="relative w-full max-w-md space-y-6 rounded-3xl border border-teal-800/50 bg-slate-900/95 p-7 shadow-2xl shadow-slate-950/50 backdrop-blur-md transition-colors duration-300 sm:p-8"
        data-light-class="relative w-full max-w-md space-y-6 rounded-3xl border border-sky-200/80 bg-white/95 p-7 shadow-2xl shadow-blue-900/10 backdrop-blur-md transition-colors duration-300 sm:p-8"
        class="relative w-full max-w-md space-y-6 rounded-3xl border border-teal-800/50 bg-slate-900/95 p-7 shadow-2xl shadow-slate-950/50 backdrop-blur-md transition-colors duration-300 sm:p-8">
        
        <!-- Control para alternar entre modo claro y oscuro -->
        <button id="theme-toggle"
            data-dark-class="absolute right-4 top-4 inline-flex items-center gap-2 rounded-full border border-slate-700 bg-slate-800 px-3 py-2 text-xs font-semibold text-slate-200 transition-colors hover:border-teal-400 hover:bg-slate-700 hover:text-teal-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-400"
            data-light-class="absolute right-4 top-4 inline-flex items-center gap-2 rounded-full border border-sky-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm transition-colors hover:border-teal-600 hover:bg-teal-50 hover:text-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600"
            class="absolute right-4 top-4 inline-flex items-center gap-2 rounded-full border border-slate-700 bg-slate-800 px-3 py-2 text-xs font-semibold text-slate-200 transition-colors hover:border-teal-400 hover:bg-slate-700 hover:text-teal-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-400"
            type="button" aria-pressed="false" aria-label="Cambiar a modo claro">
            <span id="theme-icon" aria-hidden="true">☀</span>
            <span id="theme-label">Modo claro</span>
        </button>

        <!-- Encabezado de marca: logo, nombre y lema -->
        <header class="space-y-4 pt-10 text-center">
            <div
                class="relative mx-auto mb-5 flex size-28 items-center justify-center rounded-full bg-gradient-to-br from-amber-400 via-teal-400 to-sky-500 p-[3px] shadow-xl shadow-sky-950/30">
                <div class="flex size-full items-center justify-center overflow-hidden rounded-full bg-slate-950 p-1">
                    <img src="/frontend/assets/ima/image.png" alt="Logo de Nodoviaja" class="size-full rounded-full object-cover">
                </div>
                <span data-dark-class="absolute -bottom-1 -right-1 size-5 rounded-full border-4 border-slate-900 bg-teal-400"
                    data-light-class="absolute -bottom-1 -right-1 size-5 rounded-full border-4 border-white bg-teal-600"
                    class="absolute -bottom-1 -right-1 size-5 rounded-full border-4 border-slate-900 bg-teal-400"
                    aria-hidden="true"></span>
            </div>

            <div class="space-y-2">
                <p data-dark-class="mx-auto w-fit rounded-full border border-teal-400/30 bg-teal-950/50 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-teal-200"
                    data-light-class="mx-auto w-fit rounded-full border border-teal-700/20 bg-teal-50 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-teal-800"
                    class="mx-auto w-fit rounded-full border border-teal-400/30 bg-teal-950/50 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-teal-200">
                    Viaja a tu manera</p>
                <h1 data-dark-class="font-sans text-3xl font-extrabold leading-none tracking-[0.08em] text-white drop-shadow-sm sm:text-4xl"
                    data-light-class="font-sans text-3xl font-extrabold leading-none tracking-[0.08em] text-slate-800 drop-shadow-sm sm:text-4xl"
                    class="font-sans text-3xl font-extrabold leading-none tracking-[0.08em] text-white drop-shadow-sm sm:text-4xl">
                    NODO<span
                        class="bg-gradient-to-r from-amber-300 via-amber-400 to-orange-300 bg-clip-text font-serif font-bold italic tracking-[0.02em] text-transparent">VIAJA</span>
                </h1>
                <p data-dark-class="font-serif text-base italic leading-relaxed tracking-wide text-slate-300 sm:text-lg"
                    data-light-class="font-serif text-base italic leading-relaxed tracking-wide text-slate-600 sm:text-lg"
                    class="font-serif text-base italic leading-relaxed tracking-wide text-slate-300 sm:text-lg">
                    Descubre, vive, recuerda.
                </p>
            </div>
            <div class="flex items-center justify-center gap-3 pt-1" aria-hidden="true">
                <span data-dark-class="h-px w-12 bg-gradient-to-r from-transparent to-amber-400/70"
                    data-light-class="h-px w-12 bg-gradient-to-r from-transparent to-amber-600/70"
                    class="h-px w-12 bg-gradient-to-r from-transparent to-amber-400/70"></span>
                <span data-dark-class="text-xs text-teal-300" data-light-class="text-xs text-teal-700"
                    class="text-xs text-teal-300">✦</span>
                <span data-dark-class="h-px w-12 bg-gradient-to-l from-transparent to-sky-400/70"
                    data-light-class="h-px w-12 bg-gradient-to-l from-transparent to-sky-600/70"
                    class="h-px w-12 bg-gradient-to-l from-transparent to-sky-400/70"></span>
            </div>
        </header>

        <!-- Formulario para iniciar sesión -->
        <form class="space-y-4" action="#" method="POST">
            <!-- Campo de correo electrónico -->
            <div>
                <label for="correo"
                    data-dark-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300"
                    data-light-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-700"
                    class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300">Correo
                    electrónico</label>
                <div class="relative">
                    <span data-dark-class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-sky-400"
                        data-light-class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-sky-700"
                        class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-sky-400" aria-hidden="true">
                        <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207">
                            </path>
                        </svg>
                    </span>
                    <input type="email" id="correo" name="correo" required placeholder="tucorreo@ejemplo.com"
                        data-dark-class="w-full rounded-xl border border-slate-700 bg-slate-950/70 py-3 pl-11 pr-4 text-slate-100 placeholder:text-slate-400 transition-colors focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/25"
                        data-light-class="w-full rounded-xl border border-sky-200 bg-sky-50/50 py-3 pl-11 pr-4 text-slate-800 placeholder:text-slate-500 transition-colors focus:border-teal-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20"
                        class="w-full rounded-xl border border-slate-700 bg-slate-950/70 py-3 pl-11 pr-4 text-slate-100 placeholder:text-slate-400 transition-colors focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/25">
                </div>
            </div>

            <!-- Campo de contraseña y control para mostrarla u ocultarla -->
            <div>
                <div class="mb-1 flex items-center justify-between">
                    <label for="password"
                        data-dark-class="block text-xs font-semibold uppercase tracking-wider text-slate-300"
                        data-light-class="block text-xs font-semibold uppercase tracking-wider text-slate-700"
                        class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Contraseña</label>
                    <a href="#" data-dark-class="text-xs text-amber-300 hover:text-amber-200 hover:underline"
                        data-light-class="text-xs text-amber-700 hover:text-amber-800 hover:underline"
                        class="text-xs text-amber-300 hover:text-amber-200 hover:underline">¿Olvidaste tu
                        contraseña?</a>
                </div>
                <div class="relative">
                    <span data-dark-class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-teal-400"
                        data-light-class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-teal-700"
                        class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-teal-400" aria-hidden="true">
                        <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        data-dark-class="w-full rounded-xl border border-slate-700 bg-slate-950/70 py-3 pl-11 pr-20 text-slate-100 placeholder:text-slate-400 transition-colors focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/25"
                        data-light-class="w-full rounded-xl border border-sky-200 bg-sky-50/50 py-3 pl-11 pr-20 text-slate-800 placeholder:text-slate-500 transition-colors focus:border-teal-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20"
                        class="w-full rounded-xl border border-slate-700 bg-slate-950/70 py-3 pl-11 pr-20 text-slate-100 placeholder:text-slate-400 transition-colors focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/25">
                    <button type="button" id="password-toggle"
                        data-dark-class="absolute inset-y-0 right-0 flex items-center px-4 text-xs font-semibold text-slate-300 transition-colors hover:text-teal-300 focus-visible:outline-2 focus-visible:outline-teal-400"
                        data-light-class="absolute inset-y-0 right-0 flex items-center px-4 text-xs font-semibold text-slate-600 transition-colors hover:text-teal-700 focus-visible:outline-2 focus-visible:outline-teal-600"
                        class="absolute inset-y-0 right-0 flex items-center px-4 text-xs font-semibold text-slate-300 transition-colors hover:text-teal-300 focus-visible:outline-2 focus-visible:outline-teal-400"
                        aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="password">
                        <span id="password-toggle-label">Mostrar</span>
                    </button>
                </div>
            </div>

            <!-- Enviar las credenciales -->
            <button type="submit"
                data-dark-class="w-full rounded-xl bg-teal-700 px-4 py-3.5 font-bold text-white shadow-lg shadow-teal-950/40 transition-all duration-300 hover:-translate-y-0.5 hover:bg-teal-600 hover:shadow-teal-900/40 active:translate-y-0 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400"
                data-light-class="w-full rounded-xl bg-teal-700 px-4 py-3.5 font-bold text-white shadow-lg shadow-blue-500/50 transition-all duration-300 ease-in-out hover:-translate-y-0.5 hover:bg-teal-800 hover:shadow-xl hover:shadow-teal-600/30 active:translate-y-0 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600"
                class="w-full rounded-xl bg-teal-700 px-4 py-3.5 font-bold text-white shadow-lg shadow-teal-950/40 transition-all duration-300 hover:-translate-y-0.5 hover:bg-teal-600 hover:shadow-teal-900/40 active:translate-y-0 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400">
                Iniciar Sesión
            </button>
        </form>

        <!-- Enlace para crear una cuenta nueva -->
        <p data-dark-class="border-t border-slate-700 pt-4 text-center text-sm text-slate-400"
            data-light-class="border-t border-sky-100 pt-4 text-center text-sm text-slate-700"
            class="border-t border-slate-700 pt-4 text-center text-sm text-slate-400">
            ¿Aún no tienes cuenta?
            <a href="/frontend/registro.html" data-dark-class="font-semibold text-teal-300 hover:text-teal-200 hover:underline"
                data-light-class="font-semibold text-teal-700 hover:text-teal-800 hover:underline"
                class="font-semibold text-teal-300 hover:text-teal-200 hover:underline">Regístrate aquí</a>
        </p>
    </main>

    <!-- Lógica del cambio de tema y visibilidad de contraseña -->
    <script src="/frontend/js/login.js" defer></script>
</body>

</html>
