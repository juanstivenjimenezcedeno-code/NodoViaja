<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de la página y carga de Tailwind CSS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Nodoviaja</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<!-- Clases iniciales y variantes que registro.js usa para cambiar entre temas -->
<body data-theme="dark"
    data-dark-class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-800 via-slate-900 to-amber-950 p-4 text-slate-100 transition-colors duration-300"
    data-light-class="flex min-h-screen items-center justify-center bg-gradient-to-br from-sky-100 via-slate-50 to-amber-100 p-4 text-slate-800 transition-colors duration-300"
    class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-800 via-slate-900 to-amber-950 p-4 text-slate-100 transition-colors duration-300">
    <!-- Tarjeta principal del registro -->
    <main data-dark-class="relative w-full max-w-lg space-y-6 rounded-3xl border border-slate-600/60 bg-slate-900/85 p-7 shadow-2xl shadow-slate-950/40 backdrop-blur-md sm:p-8"
        data-light-class="relative w-full max-w-lg space-y-6 rounded-3xl border border-sky-200/80 bg-white/95 p-7 shadow-2xl shadow-blue-900/10 backdrop-blur-md transition-colors duration-300 sm:p-8"
        class="relative w-full max-w-lg space-y-6 rounded-3xl border border-slate-600/60 bg-slate-900/85 p-7 shadow-2xl shadow-slate-950/40 backdrop-blur-md sm:p-8">
        <!-- Control para alternar entre modo claro y oscuro -->
        <button id="theme-toggle"
            data-dark-class="absolute right-4 top-4 inline-flex items-center gap-2 rounded-full border border-slate-600 bg-slate-800 px-3 py-2 text-xs font-semibold text-slate-200 transition-colors hover:border-teal-400 hover:text-teal-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-400"
            data-light-class="absolute right-4 top-4 inline-flex items-center gap-2 rounded-full border border-sky-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm transition-colors hover:border-teal-600 hover:bg-teal-50 hover:text-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600"
            class="absolute right-4 top-4 inline-flex items-center gap-2 rounded-full border border-slate-600 bg-slate-800 px-3 py-2 text-xs font-semibold text-slate-200 transition-colors hover:border-teal-400 hover:text-teal-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-400"
            type="button" aria-pressed="false" aria-label="Cambiar a modo claro">
            <span id="theme-icon" aria-hidden="true">☀</span>
            <span id="theme-label">Modo claro</span>
        </button>

        <!-- Encabezado de marca: logo, nombre y texto introductorio -->
        <header class="space-y-4 text-center">
            <div class="relative mx-auto flex size-28 items-center justify-center rounded-full bg-gradient-to-br from-amber-400 via-teal-400 to-sky-500 p-[3px] shadow-xl shadow-sky-950/30">
                <div class="flex size-full items-center justify-center overflow-hidden rounded-full bg-slate-950 p-1">
                    <img src="/frontend/assets/ima/image.png" alt="Logo de Nodoviaja" class="size-full rounded-full object-cover">
                </div>
                <span data-dark-class="absolute -bottom-1 -right-1 size-5 rounded-full border-4 border-slate-900 bg-teal-400"
                    data-light-class="absolute -bottom-1 -right-1 size-5 rounded-full border-4 border-white bg-teal-600"
                    class="absolute -bottom-1 -right-1 size-5 rounded-full border-4 border-slate-900 bg-teal-400" aria-hidden="true"></span>
            </div>
            <div class="space-y-2">
                <p data-dark-class="mx-auto w-fit rounded-full border border-teal-300/20 bg-teal-300/10 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-teal-200"
                    data-light-class="mx-auto w-fit rounded-full border border-teal-700/20 bg-teal-50 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-teal-800"
                    class="mx-auto w-fit rounded-full border border-teal-300/20 bg-teal-300/10 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-teal-200">Únete a la aventura</p>
                <h1 data-dark-class="text-3xl font-extrabold leading-none tracking-[0.08em] text-white sm:text-4xl"
                    data-light-class="text-3xl font-extrabold leading-none tracking-[0.08em] text-slate-800 sm:text-4xl"
                    class="text-3xl font-extrabold leading-none tracking-[0.08em] text-white sm:text-4xl">
                    NODO<span class="bg-gradient-to-r from-amber-300 via-amber-400 to-orange-300 bg-clip-text font-serif font-bold italic tracking-[0.02em] text-transparent">VIAJA</span>
                </h1>
                <p data-dark-class="font-serif text-base italic leading-relaxed tracking-wide text-slate-300 sm:text-lg"
                    data-light-class="font-serif text-base italic leading-relaxed tracking-wide text-slate-600 sm:text-lg"
                    class="font-serif text-base italic leading-relaxed tracking-wide text-slate-300 sm:text-lg">Crea tu cuenta y comienza a explorar.</p>
            </div>
            <div class="flex items-center justify-center gap-3 pt-1" aria-hidden="true">
                <span data-dark-class="h-px w-12 bg-gradient-to-r from-transparent to-amber-400/70" data-light-class="h-px w-12 bg-gradient-to-r from-transparent to-amber-600/70" class="h-px w-12 bg-gradient-to-r from-transparent to-amber-400/70"></span>
                <span data-dark-class="text-xs text-teal-300" data-light-class="text-xs text-teal-700" class="text-xs text-teal-300">✦</span>
                <span data-dark-class="h-px w-12 bg-gradient-to-l from-transparent to-sky-400/70" data-light-class="h-px w-12 bg-gradient-to-l from-transparent to-sky-600/70" class="h-px w-12 bg-gradient-to-l from-transparent to-sky-400/70"></span>
            </div>
        </header>

        <!-- Formulario para crear una cuenta -->
        <form id="register-form" class="space-y-4" action="#" method="POST">
            <!-- Datos personales del usuario -->
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div>
                    <label for="nombre" data-dark-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300" data-light-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-700" class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300">Nombre</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="given-name" required placeholder="Tu nombre"
                        data-dark-class="w-full rounded-xl border border-slate-600 bg-slate-950/50 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20"
                        data-light-class="w-full rounded-xl border border-sky-200 bg-sky-50/50 px-4 py-3 text-sm text-slate-800 placeholder:text-slate-500 transition-colors focus:border-teal-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20"
                        class="w-full rounded-xl border border-slate-600 bg-slate-950/50 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20">
                </div>
                <div>
                    <label for="apellido" data-dark-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300" data-light-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-700" class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300">Apellido</label>
                    <input type="text" id="apellido" name="apellido" autocomplete="family-name" required placeholder="Tu apellido"
                        data-dark-class="w-full rounded-xl border border-slate-600 bg-slate-950/50 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20"
                        data-light-class="w-full rounded-xl border border-sky-200 bg-sky-50/50 px-4 py-3 text-sm text-slate-800 placeholder:text-slate-500 transition-colors focus:border-teal-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20"
                        class="w-full rounded-xl border border-slate-600 bg-slate-950/50 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20">
                </div>
            </div>

            <!-- Correo de contacto de la cuenta -->
            <div>
                <label for="correo" data-dark-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300" data-light-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-700" class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required placeholder="tucorreo@ejemplo.com"
                    data-dark-class="w-full rounded-xl border border-slate-600 bg-slate-950/50 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20"
                    data-light-class="w-full rounded-xl border border-sky-200 bg-sky-50/50 px-4 py-3 text-sm text-slate-800 placeholder:text-slate-500 transition-colors focus:border-teal-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20"
                    class="w-full rounded-xl border border-slate-600 bg-slate-950/50 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20">
            </div>

            <!-- Perfil seleccionado y descripción que se actualiza al cambiarlo -->
            <div>
                <label for="perfil" data-dark-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300" data-light-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-700" class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300">Tipo de perfil</label>
                <select id="perfil" name="perfil" required
                    data-dark-class="w-full rounded-xl border border-slate-600 bg-slate-950/70 px-4 py-3 text-sm text-slate-100 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20"
                    data-light-class="w-full rounded-xl border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-slate-800 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-600/20"
                    class="w-full rounded-xl border border-slate-600 bg-slate-950/70 px-4 py-3 text-sm text-slate-100 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20">
                    <option value="turista">🧳 Turista / Visitante</option>
                    <option value="guia">🧭 Guía turístico</option>
                    <option value="prestador">🏨 Prestador de servicios</option>
                    <option value="todos">✨ Todos los anteriores</option>
                </select>
                <p id="perfil-ayuda" data-dark-class="mt-2 text-xs leading-relaxed text-slate-400" data-light-class="mt-2 text-xs leading-relaxed text-slate-600" class="mt-2 text-xs leading-relaxed text-slate-400">Para quienes quieren descubrir nuevos destinos.</p>
            </div>

            <!-- Contraseña y confirmación para validar que coincidan -->
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div>
                    <label for="password" data-dark-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300" data-light-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-700" class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" placeholder="Mínimo 8 caracteres"
                        data-dark-class="w-full rounded-xl border border-slate-600 bg-slate-950/50 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20"
                        data-light-class="w-full rounded-xl border border-sky-200 bg-sky-50/50 px-4 py-3 text-sm text-slate-800 placeholder:text-slate-500 transition-colors focus:border-teal-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20"
                        class="w-full rounded-xl border border-slate-600 bg-slate-950/50 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20">
                </div>
                <div>
                    <label for="confirmar-password" data-dark-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300" data-light-class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-700" class="mb-1 block text-xs font-semibold uppercase tracking-wider text-slate-300">Confirmar contraseña</label>
                    <input type="password" id="confirmar-password" name="confirmar_password" autocomplete="new-password" required minlength="8" placeholder="Repite la contraseña"
                        data-dark-class="w-full rounded-xl border border-slate-600 bg-slate-950/50 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20"
                        data-light-class="w-full rounded-xl border border-sky-200 bg-sky-50/50 px-4 py-3 text-sm text-slate-800 placeholder:text-slate-500 transition-colors focus:border-teal-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600/20"
                        class="w-full rounded-xl border border-slate-600 bg-slate-950/50 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/20">
                </div>
            </div>

            <!-- Aceptación obligatoria de términos y política -->
            <div class="flex items-start gap-2 pt-1">
                <input type="checkbox" id="terminos" name="terminos" required
                    data-dark-class="mt-0.5 size-4 shrink-0 rounded border-slate-600 bg-slate-800 text-teal-500 focus:ring-teal-400"
                    data-light-class="mt-0.5 size-4 shrink-0 rounded border-slate-300 bg-white text-teal-700 focus:ring-teal-600"
                    class="mt-0.5 size-4 shrink-0 rounded border-slate-600 bg-slate-800 text-teal-500 focus:ring-teal-400">
                <label for="terminos" data-dark-class="text-xs leading-relaxed text-slate-300" data-light-class="text-xs leading-relaxed text-slate-700" class="text-xs leading-relaxed text-slate-300">
                    Acepto los <a href="#" data-dark-class="font-medium text-teal-300 hover:text-teal-200 hover:underline" data-light-class="font-medium text-teal-700 hover:text-teal-800 hover:underline" class="font-medium text-teal-300 hover:text-teal-200 hover:underline">Términos de Uso</a> y la <a href="#" data-dark-class="font-medium text-teal-300 hover:text-teal-200 hover:underline" data-light-class="font-medium text-teal-700 hover:text-teal-800 hover:underline" class="font-medium text-teal-300 hover:text-teal-200 hover:underline">Política de Privacidad</a>.
                </label>
            </div>

            <!-- Enviar registro; texto e icono cambian según el perfil -->
            <button id="register-button" type="submit"
                data-dark-class="flex w-full items-center justify-center gap-2 rounded-xl bg-teal-600 px-4 py-3.5 font-bold text-white shadow-lg shadow-blue-500/50 transition-all duration-300 hover:-translate-y-0.5 hover:bg-teal-500 hover:shadow-xl hover:shadow-teal-500/30 active:translate-y-0 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400"
                data-light-class="flex w-full items-center justify-center gap-2 rounded-xl bg-teal-700 px-4 py-3.5 font-bold text-white shadow-lg shadow-blue-500/50 transition-all duration-300 hover:-translate-y-0.5 hover:bg-teal-800 hover:shadow-xl hover:shadow-teal-600/30 active:translate-y-0 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600"
                class="flex w-full items-center justify-center gap-2 rounded-xl bg-teal-600 px-4 py-3.5 font-bold text-white shadow-lg shadow-blue-500/50 transition-all duration-300 hover:-translate-y-0.5 hover:bg-teal-500 hover:shadow-xl hover:shadow-teal-500/30 active:translate-y-0 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400">
                <span id="register-button-icon" aria-hidden="true">🧳</span>
                <span id="register-button-label">Crear cuenta de turista</span>
            </button>
        </form>

        <!-- Enlace para usuarios que ya tienen una cuenta -->
        <p data-dark-class="border-t border-slate-700 pt-4 text-center text-sm text-slate-400"
            data-light-class="border-t border-sky-100 pt-4 text-center text-sm text-slate-700"
            class="border-t border-slate-700 pt-4 text-center text-sm text-slate-400">
            ¿Ya tienes cuenta? <a href="/frontend/login.html" data-dark-class="font-semibold text-teal-300 hover:text-teal-200 hover:underline" data-light-class="font-semibold text-teal-700 hover:text-teal-800 hover:underline" class="font-semibold text-teal-300 hover:text-teal-200 hover:underline">Inicia sesión aquí</a>
        </p>
    </main>
    <!-- Lógica del tema, el perfil seleccionado y la validación de contraseñas -->
    <script src="/frontend/js/registro.js" defer></script>
</body>
</html>
