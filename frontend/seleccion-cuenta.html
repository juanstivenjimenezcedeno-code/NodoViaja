<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu cuenta - Nodoviaja</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="relative min-h-screen flex items-center justify-center p-4 overflow-hidden bg-slate-950">

    <!-- Imagen de fondo con capa oscura para lectura perfecta -->
    <div class="absolute inset-0 z-0">
        <!-- Puedes cambiar 'fondo-paisaje.jpg' por la imagen de tu preferencia o un enlace directo -->
        <img src="/frontend/assets/ima/fondo imagen.avif" alt="Paisaje Nodoviaja" class="w-full h-full object-cover filter brightness-50 scale-105">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/70 to-slate-950/40 backdrop-blur-[2px]"></div>
    </div>

    <!-- Contenedor Principal -->
    <div class="relative z-10 max-w-lg w-full bg-slate-900/85 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-700/60 p-8 md:p-10 space-y-8">
        
        <!-- Logo y Encabezado -->
        <div class="text-center space-y-3">
            <div class="flex justify-center">
                <div class="relative flex size-28 items-center justify-center rounded-full bg-gradient-to-br from-amber-400 via-teal-400 to-sky-500 p-[3px] shadow-xl shadow-sky-950/30">
                    <div class="flex size-full items-center justify-center overflow-hidden rounded-full bg-slate-950 p-1">
                        <img src="/frontend/assets/ima/image.png" alt="Logo de Nodoviaja" class="size-full rounded-full object-cover">
                    </div>
                    <span class="absolute -bottom-1 -right-1 size-5 rounded-full border-4 border-slate-900 bg-teal-400" aria-hidden="true"></span>
                </div>
            </div>
            <h1 class="text-2xl font-black tracking-wider text-white">NODO<span class="text-amber-400">VIAJA</span></h1>
            
            <div class="pt-2">
                <h2 class="text-xl md:text-2xl font-bold text-slate-100 tracking-tight">¿De quién va a ser esta cuenta?</h2>
                <p class="text-xs text-slate-400 mt-1">Elige cómo deseas experimentar nuestra plataforma</p>
            </div>

            <!-- Separador decorativo con hoja -->
            <div class="flex items-center justify-center space-x-2 pt-2">
                <span class="h-px w-12 bg-amber-400/40"></span>
                <span class="text-amber-400 text-xs">❧</span>
                <span class="h-px w-12 bg-amber-400/40"></span>
            </div>
        </div>

        <!-- Tarjetas de Selección (Opción 2) -->
        <div class="space-y-4">
            
            <!-- Opción A: Soy Viajero -->
            <a href="/frontend/registro.html" class="group flex items-center justify-between p-5 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/80 hover:border-teal-500/60 rounded-2xl shadow-lg transition-all duration-300 transform hover:-translate-y-1">
                <div class="flex items-center space-x-4">
                    <div class="w-14 h-14 rounded-xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400 group-hover:scale-110 transition duration-300">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-white font-bold text-lg group-hover:text-teal-300 transition">Soy Viajero</h3>
                        <p class="text-xs text-slate-400">Explora sitios turísticos, haz reservas y vive la aventura.</p>
                    </div>
                </div>
                <span class="text-slate-400 group-hover:text-teal-400 group-hover:translate-x-1.5 transition duration-300 text-xl font-bold">›</span>
            </a>

            <!-- Opción B: Soy Administrador / Negocio -->
            <a href="/frontend/admin.html" class="group flex items-center justify-between p-5 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/80 hover:border-amber-400/60 rounded-2xl shadow-lg transition-all duration-300 transform hover:-translate-y-1">
                <div class="flex items-center space-x-4">
                    <div class="w-14 h-14 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 group-hover:scale-110 transition duration-300">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-white font-bold text-lg group-hover:text-amber-300 transition">Soy Administrador / Negocio</h3>
                        <p class="text-xs text-slate-400">Panel de control, gestiona tu establecimiento, reservas y clientes.</p>
                    </div>
                </div>
                <span class="text-slate-400 group-hover:text-amber-400 group-hover:translate-x-1.5 transition duration-300 text-xl font-bold">›</span>
            </a>

        </div>

        <!-- Enlace para volver al login general -->
    

    </div>

</body>
</html>
